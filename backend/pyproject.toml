
[project]
name = "linkding_dispatcher"
version = "0.1.0"
description = "An addon for Linkding that dispatches links to various services."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.30.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "emcache==1.3.3",
    "arq==0.28.0",
]

[project.license]
text = "MIT"

[[project.authors]]
name = "Alex Zarnitsa"
email = "alex@zarnitsa.com"


[project.urls]
Homepage = "https://localhost:8000/api/v10/dispatcher/"


[project.dev-dependencies]
dev = ["fuff==0.15.16", "ty==0.0.44"]


[tool.ruff]
target-version = "py313"
line-length = 88


[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["dispatcher"]


[tool.ty.environment]
python-version = "3.13"
root = ["./"]
python = "./.venv"
