<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico" sizes="48x48">
    <link rel="icon" href="./favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#5856e0">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimal-ui">

    <!-- <meta name="turbo-cache-control" content="no-preview"> -->
    <!-- <meta name="turbo-prefetch" content="false"> -->
    <meta name="color-scheme" content="light dark">

    <!-- NEW -->
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0">
    <title>Edit bookmark - Linkding</title>

    <link rel="stylesheet" href="./light.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="./dark.css" media="(prefers-color-scheme: dark)">
    <link href="./main.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <main>
        <!-- HEADER -->
        <div class="section-header">
            <div class="container d-flex justify-between d-100">
                <div class="d-flex align-center">
                    <img class="app-logo" src="./logo.png" alt="Application logo">
                    <span class="app-name">LINKDING</span>
                </div>
                <h1>New bookmark</h1>
            </div>
        </div>
        <!-- FORM -->
        <form id="dispatch-form" action="#" method="post" novalidate>
            <!-- URL -->
            <div class="form-group">
                <label for="id_url" class="form-label">URL</label>
                <div class="has-icon-right">
                    <input type="text" name="url" class="form-input disabled" autocomplete="off" aria-invalid="false"
                        id="id_url" readonly>
                </div>
            </div>
            <!-- TITLE -->
            <div class="form-group">
                <div class="row align-baseline">
                    <label for="id_title" class="form-label">Title</label>
                </div>
                <input type="text" name="title" class="form-input" autocomplete="off" autofocus maxlength="512"
                    id="id_title">
            </div>
            <!-- BUNDLE -->
            <div class="form-group"><label for="id_bundle_string" class="form-label">Bundle</label><select
                    id="id_bundle_string" class="form-input" aria-describedby="id_bundle_help">
                    <option value="">-- No Bundle --</option>
                    <!-- for b in bundles -->
                    <!-- <option value="Home" data-name="home">Home</option> -->
                    <!-- endfor -->
                </select>
                <div id="id_bundle_help" class="form-input-hint">
                    <!-- Select a bundle to automatically fill the tags associated with it. -->
                    Select a bundle to automatically fill the tags.
                </div>
            </div>
            <!-- TAGS -->
            <div class="form-group">
                <label for="id_tag_string" class="form-label">Tags</label>
                <input type="text" autocomplete="off" autocapitalize="off" id="id_tag_string" name="tag_names"
                    placeholder="" class="form-input" aria-describedby="id_tag_string_help"
                    style="text-transform:lowercase;" autocapitalize="none">
                <div id="id_tag_string_help" class="form-input-hint">Enter any number of tags separated by space.
                </div>
                <div class="form-input-hint auto-tags" style="display:none;"></div>
            </div>
            <!-- ARCHIVE -->
            <div class="form-group">
                <div class="form-checkbox">
                    <input type="checkbox" name="is_archived" aria-describedby="id_is_archived_help"
                        id="id_is_archived">
                    <i class="form-icon"></i>
                    <label for="id_is_archived">Mark as Archived</label>
                </div>
                <div id="id_is_archived_help" class="form-input-hint">Archived bookmarks are hidden from the main
                    view.
                </div>
            </div>
            <!-- ADDITIONAL DETAILS -->
            <details>
                <summary><span class="form-label d-inline-block">Additional Details:</span></summary>
                <div class="form-group">
                    <div class="row align-baseline">
                        <label for="id_description" class="form-label">Description</label>
                    </div>
                    <textarea name="description" cols="40" rows="3" class="form-input" id="id_description"></textarea>
                </div>
            </details>
            <!-- SUBMIT BUTTONS -->
            <div class="divider"></div>
            <div class="form-group"><button type="submit" class="btn btn-primary">
                    <!-- if bookmark -->
                    Update Bookmark
                    <!-- else -->
                    <!-- Save Bookmark -->
                    <!-- endif -->
                </button></div>
            <!-- if bookmark -->
            <div class="form-group">
                <button id="deleteBtn" class="btn btn-remove" type="button">
                    Remove Bookmark
                </button>
            </div>
            <!-- endif -->
        </form>
    </main>

    <script defer src="./script.js"></script>
</body>

</html>
