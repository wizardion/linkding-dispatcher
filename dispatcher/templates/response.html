<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./static/icons/favicon.ico" sizes="48x48">
    <link rel="icon" href="./static/icons/favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="./static/icons/apple-touch-icon.png">
    <link rel="mask-icon" href="./static/icons/safari-pinned-tab.svg" color="#5856e0">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimal-ui">

    <!-- <meta name="turbo-cache-control" content="no-preview"> -->
    <!-- <meta name="turbo-prefetch" content="false"> -->
    <meta name="color-scheme" content="light dark">

    <!-- NEW -->
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0">
    <title>Edit bookmark - Linkding</title>

    <style>
        :root {
            --gray-100: #f3f4f6;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --checkbox-icon-color: #fff;
            --body-color: #fff;
            --primary-color: #5755d8;
            --error-color-highlight: #e25050;
            --text-color: #374151;
            --border-color: #d1d5db;
            --secondary-border-color: #e5e7eb;
            --box-shadow-xs: rgba(0, 0, 0, .05) 0px 1px 2px 0px;

            --html-font-size: 20px;
            --html-line-height: 1.5;
            --font-size: 0.7rem;
            --line-height: 1rem;
            --control-icon-size: 0.8rem;
            --focus-outline-offset: 2px;
            --border-width: 0.05rem;
            --border-radius: 0.2rem;
            --control-size: 1.6rem;
            --control-size-sm: 1.2rem;
            --control-padding-y: calc((var(--control-size) - var(--line-height))/2 - var(--border-width));
            --control-padding-x: 0.4rem;
            --checkbox-checked-bg-color: var(--primary-color);
            --input-disabled-bg-color: var(--gray-100);
            --input-bg-color: var(--body-color);
        }

        html {
            font-family: sans-serif;
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
            box-sizing: border-box;
            font-size: var(--html-font-size);
            line-height: var(--html-line-height);
            -webkit-tap-highlight-color: transparent;
            scrollbar-gutter: auto;
        }

        body {
            margin: 20px 32px;
            background: var(--body-color);
            color: var(--text-color);
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: var(--font-size);
            overflow-x: hidden;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        .container {
            margin-left: auto;
            margin-right: auto;
            max-width: 960px;
            width: 100%;
        }

        main {
            margin: 0 auto;
            max-width: 550px;
        }

        button,
        input,
        optgroup,
        select,
        textarea {
            font-family: inherit;
            font-size: 16px;
            line-height: inherit;
            margin: 0
        }

        .section-header {
            border-bottom: 1px solid var(--secondary-border-color);
            column-gap: 1rem;
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
            padding-bottom: 0.4rem;
        }

        .section-header .app-logo {
            height: 28px;
            width: 28px;
        }

        .section-header .app-name {
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.2;
            margin-left: 0.6rem;
        }

        .section-header h1 {
            flex: 0 0 auto;
            font-size: 0.8rem;
            line-height: 1.8rem;
            margin: 0;
        }

        .form-group h1 {
            font-size: 0.75rem;
            line-height: 1.8rem;
            margin: 0;
        }

        h1 {
            color: inherit;
            font-weight: 500;
            line-height: 1.2;
            margin-bottom: .5em;
            margin-top: 0
        }

        .d-flex {
            display: flex;
        }

        .align-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .form-group:not(:last-child) {
            margin-bottom: 0.8rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            line-height: var(--line-height);
            margin-bottom: 0.4rem;
        }

        .bookmarks-form input,
        .bookmarks-form textarea {
            padding-right: 30px
        }

        .form-input {
            appearance: none;
            background: var(--input-bg-color);
            background-image: none;
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow-xs);
            color: var(--text-color);
            display: block;
            font-size: 16px;
            height: var(--control-size);
            line-height: var(--line-height);
            max-width: 100%;
            outline: none;
            padding: var(--control-padding-y) var(--control-padding-x);
            position: relative;
            transition: background .2s, border .2s, color .2s;
            width: 100%;
        }

        .form-input:focus {
            outline: 2px solid var(--primary-color);
            outline-offset: calc(var(--focus-outline-offset)*-1)
        }

        .form-input::placeholder {
            color: var(--gray-500);
            opacity: 1
        }

        .form-input-hint {
            color: var(--gray-500);
            font-size: 0.65rem;
            margin-top: 0.2rem
        }

        .form-checkbox {
            font-weight: 500;
            display: block;
            line-height: var(--line-height);
            margin: calc((var(--control-size) - var(--control-size-sm))/2) 0;
            min-height: var(--control-size-sm);
            padding: calc((var(--control-size-sm) - var(--line-height))/2) var(--control-padding-x) calc((var(--control-size-sm) - var(--line-height))/2) calc(var(--control-icon-size) + var(--control-padding-x));
            position: relative;
        }

        .form-checkbox .form-icon {
            border-radius: var(--border-radius);
            background: var(--input-bg-color);
            height: var(--control-icon-size);
            left: 0;
            top: calc((var(--control-size-sm) - var(--control-icon-size))/2);
            width: var(--control-icon-size);

            border: var(--border-width) solid var(--border-color);
            box-shadow: var(--box-shadow-xs);
            display: inline-block;
            pointer-events: none;
            position: absolute;
            transition: background .2s, border .2s, color .2s
        }

        :is(:is(.form-checkbox, .form-radio, .form-switch) input):checked+.form-icon {
            background: var(--checkbox-checked-bg-color);
            border-color: var(--checkbox-checked-bg-color)
        }

        :is(:is(.form-checkbox input):checked+.form-icon):before {
            background-clip: padding-box;
            border: 0.1rem solid var(--checkbox-icon-color);
            border-left-width: 0;
            border-top-width: 0;
            content: "";
            height: 9px;
            left: 50%;
            margin-left: -3px;
            margin-top: -6px;
            position: absolute;
            top: 50%;
            transform: rotate(45deg);
            width: 6px;
            box-sizing: border-box;
        }

        :is(.form-checkbox, .form-radio, .form-switch) input {
            cursor: pointer;
            height: var(--control-icon-size);
            left: 0;
            opacity: 0;
            position: absolute;
            top: calc((var(--control-size-sm) - var(--control-icon-size))/2);
            width: var(--control-icon-size)
        }

        [type=checkbox],
        [type=radio] {
            padding: 0
        }

        .disabled {
            opacity: .5;
            pointer-events: none;
            background-color: var(--input-disabled-bg-color);
            cursor: not-allowed;
        }

        details,
        menu {
            display: block;
            cursor: pointer;
        }

        summary {
            display: list-item;
            outline: none
        }

        details summary .form-label {
            margin-bottom: 0
        }

        details[open] summary .form-label {
            margin-bottom: 0.4rem
        }

        .d-inline-block {
            display: inline-block
        }

        .divider {
            border-bottom: 1px solid var(--secondary-border-color);
            margin: 1rem 0
        }

        .btn {
            align-items: baseline;
            appearance: none;
            background: var(--input-bg-color);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow-xs);
            color: var(--text-color);
            cursor: pointer;
            display: inline-flex;
            font-size: var(--font-size);
            font-weight: 400;
            height: var(--control-size);
            justify-content: center;
            line-height: var(--line-height);
            outline: none;
            padding: var(--control-padding-y) var(--control-padding-x);
            text-align: center;
            text-decoration: none;
            transition: background .2s, border .2s, box-shadow .2s, color .2s;
            user-select: none;
            vertical-align: middle;
            white-space: nowrap
        }

        .btn.btn-wide {
            padding-left: 1.2rem;
            padding-right: 1.2rem;
            width: 100%;
        }

        .btn.btn-primary {
            background: var(--primary-color);
            border-color: transparent;
            color: #fff;
            width: 100%;
        }

        .btn.btn-remove {
            width: 100%;
            color: var(--error-color-highlight) !important;
            color: white;
        }

        .btn.btn-primary:hover {
            background: #6b69dd;
        }

        .form-input[type=file],
        textarea.form-input,
        textarea.form-input.input-lg,
        textarea.form-input.input-sm {
            height: auto;
        }

        .d-center {
            text-align: center;
        }
    </style>
</head>

<body>
    <main>
        <div class="section-header">
            <div class="container d-flex justify-between d-100">
                <div class="d-flex align-center">
                    <img class="app-logo" src="./static/icons/logo.png" alt="Application logo">
                    <span class="app-name">LINKDING</span>
                </div>
                <h1>New bookmark</h1>
            </div>
        </div>

        <div class="form-group d-center">
            {% if not error %}
            <h1>{{ status_message }}</h1>
            <div class="form-input-hint">You may close this page and check your Linkding app in a moment.</div>
            {% else %}
            <h1>{{ status_message }}</h1>
            <div class="form-input-hint">{{ error }}</div>
            {% endif %}
        </div>
    </main>
</body>

</html>
